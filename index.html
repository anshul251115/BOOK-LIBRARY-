<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EmailJS Test</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#080b16;
    color:white;
    font-family:Arial,sans-serif;
}

.box{
    width:min(90%,450px);
    background:#111729;
    padding:30px;
    border-radius:20px;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin:8px 0 15px;
    border-radius:10px;
    border:1px solid #333b55;
    background:#080b16;
    color:white;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#7c5cff;
    color:white;
    font-weight:bold;
}

#result{
    margin-top:20px;
    padding:12px;
    border-radius:10px;
    display:none;
    word-break:break-word;
}
</style>
</head>

<body>

<div class="box">

<h2>BookNest Email Test</h2>

<p>Enter the email address where you want to receive the test email.</p>

<input
    id="email"
    type="email"
    placeholder="your@email.com"
    required>

<button id="sendBtn">
Send Test Email
</button>

<div id="result"></div>

</div>

<script>

const SERVICE_ID = "service_y8sw1vp";
const TEMPLATE_ID = "template_77p6jj8";
const PUBLIC_KEY = "kR99j_G63iMQWnNeB";

emailjs.init({
    publicKey: PUBLIC_KEY
});

const button = document.getElementById("sendBtn");
const result = document.getElementById("result");

function showResult(message,success){

    result.style.display = "block";
    result.textContent = message;

    result.style.background =
        success
        ? "#123d2c"
        : "#401c27";
}

button.addEventListener("click",async function(){

    const email =
        document.getElementById("email")
        .value
        .trim();

    if(!email){

        showResult(
            "Please enter an email address.",
            false
        );

        return;
    }

    button.disabled = true;
    button.textContent = "Sending...";

    try{

        const response = await emailjs.send(
            SERVICE_ID,
            TEMPLATE_ID,
            {
                user_name:"BookNest Test User",
                user_email:email,
                message:"This is a test email from BookNest."
            }
        );

        console.log("EmailJS response:",response);

        showResult(
            "SUCCESS! EmailJS accepted the email request. Status: " +
            response.status +
            " / " +
            response.text,
            true
        );

    }catch(error){

        console.error("EMAILJS ERROR:",error);

        showResult(
            "FAILED\n\nStatus: " +
            (error.status || "unknown") +
            "\n\nMessage: " +
            (error.text || error.message || JSON.stringify(error)),
            false
        );

    }finally{

        button.disabled = false;
        button.textContent = "Send Test Email";

    }

});

</script>

</body>
</html>
